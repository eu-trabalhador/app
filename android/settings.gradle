pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()

    // Repositório do React Native (para plugins)
    maven {
      url(
              new File(
                      ["node", "--print", "require.resolve('react-native/package.json')"]
                              .execute(null, rootDir)
                              .text
                              .trim(),
                      "../android"
              )
      )
    }
  }

  includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
  id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

rootProject.name = "Eu Trabalhador"

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

  repositories {
    google()
    mavenCentral()
    maven { url("https://jitpack.io") }

    // Repositório do React Native
    maven {
      url(
              new File(
                      ["node", "--print", "require.resolve('react-native/package.json')"]
                              .execute(null, rootDir)
                              .text
                              .trim(),
                      "../android"
              )
      )
    }
  }

  versionCatalogs {
    reactAndroidLibs {
      from(
              files(
                      new File(
                              ["node", "--print", "require.resolve('react-native/package.json')"]
                                      .execute(null, rootDir)
                                      .text
                                      .trim(),
                              "../gradle/libs.versions.toml"
                      )
              )
      )
    }
  }
}

// Composite build do plugin RN (ok manter)
includeBuild("../node_modules/@react-native/gradle-plugin")

// 🔥 EXPO AUTO-LINKING (faltava)
apply from: new File(
        ["node", "--print", "require.resolve('expo/package.json')"]
                .execute(null, rootDir)
                .text
                .trim(),
        "../scripts/autolinking.gradle"
)
useExpoModules()

include(":app")
